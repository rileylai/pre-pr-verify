[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[project]
name = "pre-pr-verify"
version = "0.1.6"
description = "Independent, evidence-based pre-PR verification for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
]

[project.scripts]
pre-pr-verify = "pre_pr_verify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.pre-pr-verify.verification]
checks = [
    { id = "deterministic-suite", level = "required", argv = ["python", "-c", "import sys; sys.path.insert(0, 'src'); import pytest; raise SystemExit(pytest.main(['-q']))"], reason = "The repository documents its deterministic pytest suite as the canonical development check; the explicit src path tests the snapshot candidate rather than an installed editable source tree." },
]
